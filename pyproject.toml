[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datarsi"
version = "0.1.0"
description = "DataRSI: A 3D Data Harness for Failure-to-Data Evolution (ICASSP 2027)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "DataRSI Authors", email = "pris_cv@bupt.edu.cn" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pillow>=9.5.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]
