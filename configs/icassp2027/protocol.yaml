# DataRSI Protocol Definition Gamma
version: "1.0.0"
study: "ICASSP 2027 DataRSI Testbed"

task_domain: "camera_controlled_editing"
factor_space:
  azimuths_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  elevations_deg: [-30, 0, 30, 60]
  distances_m: [2.4, 4.0, 7.2]
  total_cells: 32
  total_views: 96

request_budget_M: 72

generator_G:
  base_model: "Qwen/Qwen-Image-Edit-2511"
  renderer: "Blender 4.0+ (Cycles/EEVEE)"
  resolution: [512, 512]

diagnostic_evaluator_F_diag:
  model: "VGGT"
  metric: "rotation_error_deg"
  slice_ranking: "descending_error"
  weak_slice_top_K: 4
  weak4_cells:
    - [135, 60]
    - [225, -30]
    - [135, -30]
    - [225, 30]

sample_contract_g_sample:
  min_bbox_margin: 0.05
  min_mask_coverage: 0.01
  ray_grid_resolution: 96
  min_visible_amodal_ray_ratio: 0.80
  disallow_mesh_intersection: true

repair_policy:
  max_attempts: 2
  eligible_defects:
    - "underexposure"
    - "overexposure"
    - "ground_occlusion"
    - "ground_intersection"
  actions:
    underexposure_ev_boost: [0.5, 1.0]
    overexposure_ev_reduction: [-0.5, -1.0]
    support_lift_z: [0.25, 0.50]

trainer_T:
  type: "LoRA"
  rank: 32
  alpha: 32
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  steps: 2700
  batch_size: 8
  total_exposures: 21600

admission_evaluator_F_adm:
  model: "OriAnyV2"
  metric: "geodesic_rotation_error_deg"

regression_guard_g_RA:
  min_weak4_reduction_pct: 5.0
  max_non_target_regression_pct: 2.0
  canonical_hard_redline_deg: 5.000
